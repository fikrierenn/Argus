# Denetci kapisi esleme dosyasi — PROJEYE OZEL (sync ETMEZ)
#
# Bicim:  etiket::grep-deseni::gerekce
# Etiket commit mesajindaki [reviewed: ...] beyaninda kullanilir.

sql-sp::^sql/.*\.sql$::SP/sema degisti — transaction, idempotency, ileri bagimlilik, THROW araligi
code::\.(cs|cshtml)$::kod degisti — Turkce yorum, 80 satir, magic string, guard clause
security::Features/.*\.cshtml(\.cs)?$|Program\.cs$|Security/::yeni yuzey/yetki — RBAC, CSRF, IDOR, XSS, sir sizintisi
ai-pipeline::AiWorker/|Skills/|sql/.*ai_|sql/.*learning|sql/.*skill::AI hatti — kademeli maliyet, halusinasyon kapisi, insan onayi
etl::etl|snapshot|rpt_::ETL/snapshot — idempotency kaniti, gun seviyesi tarih, src.* alias
