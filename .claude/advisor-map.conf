# Danisman kapisi esleme dosyasi — PROJEYE OZEL (sync ETMEZ)
#
# Hook'un mekanizmasi ortaktir, esleme degildir: her projenin kendi
# danismanlari ve kendi klasor yapisi var. Operax'a tasirken ogrenildi —
# BkmArgus'un 'bkmargus-*' danismanlari orada yok, kapi olmayan bir
# danismani isaret ediyordu.
#
# Bicim:  alan::desen1,desen2::danisman::gerekce
# Desenler shell 'case' kaliplari (goreli ve mutlak yol icin ikisini de yaz).

sql::sql/*.sql,*/sql/*.sql::sql-migration-writer (yeni migration/sema) · bkmargus-sp-first (SP yazimi)::Idempotency, ileri bagimlilik, acik transaction, THROW araligi, Turkce parametre sozlesmesi.
ai::*BkmArgus.AiWorker/*,*/Skills/*,*ai_*.sql,*learning*.sql,*skill*.sql::bkmargus-ai-worker::Kademeli maliyet (LLM son care), prompt DB'de, halusinasyon kapisi, insan onayi, job idempotency.
tespit::*consistency*,*Consistency*,*anomali*,*tespit*::bkmargus-tespit::Yanlis pozitif/negatif dengesi, "veri yok" ile "sorun yok" ayrimi, sayim dogrulugu, kirilgan eslestirme.
ekran::*Features/*.cshtml,*Features/*.cshtml.cs::screen-ux-standard::Form akisi, bos durum, hata geri bildirimi, [Authorize] policy, Turkce UI.
etl::*etl*,*Etl*,*rpt_*,*_snapshot*::bkmargus-etl::Gunluk snapshot kurali, idempotency kaniti, src.* alias, ehAltDepo=0, veri kalitesi kapisi.
risk::*risk*,*Risk*::bkmargus-risk-model::Esik/agirlik, yanlis pozitif-negatif dengesi, eskalasyon, geriye donuk karsilastirilabilirlik.
